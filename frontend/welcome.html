<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Household</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icons/icon-192.png" />
    <meta name="theme-color" content="#0f6b6b" />
  </head>
  <body>
    <div class="top">
      <header class="centered">
        <img class="logo" src="icons/icon-192.png" alt="" />
        <h1>Household</h1>
      </header>
    </div>

    <main class="welcome">
      <h2 class="title">Your home, in one list</h2>

      <div id="start">
        <p class="intro">
          Create a household to start tracking, or join one with a code someone
          shared with you.
        </p>

        <form id="create-form">
          <h2>Create</h2>
          <label>
            Household name
            <input name="name" type="text" placeholder="e.g. beaver family" required />
          </label>
          <button class="primary">Create household</button>
        </form>

        <p class="or">or</p>

        <form id="join-form">
          <h2>Join</h2>
          <label>
            Household code
            <input name="code" type="text" placeholder="e.g. beaver-family-k7m3q9xp" required />
          </label>
          <button class="secondary">Join household</button>
          <p id="join-error" hidden>That code doesn't match any household.</p>
        </form>
      </div>

      <section id="result" hidden>
        <h2>You're in</h2>
        <p>Send this invite link to the people you live with.</p>
        <div class="actions">
          <button id="copy">Copy invite link</button>
          <a href="index.html">Continue</a>
        </div>
      </section>
    </main>

    <script src="household.js"></script>
    <script src="welcome.js"></script>
  </body>
</html>
