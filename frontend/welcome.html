<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Household</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Household</h1>
    </header>

    <main class="welcome">
      <p>
        Create a household to start tracking, or join one with a code someone
        shared with you.
      </p>

      <form id="create-form">
        <h2>Create</h2>
        <label>
          Household name
          <input name="name" type="text" placeholder="e.g. beaver family" required />
        </label>
        <button class="primary">Create household</button>
      </form>

      <form id="join-form">
        <h2>Join</h2>
        <label>
          Household code
          <input name="code" type="text" placeholder="e.g. beaver-family-800" required />
        </label>
        <button class="primary">Join household</button>
        <p id="join-error" hidden>That code doesn't match any household.</p>
      </form>

      <section id="result" hidden>
        <h2>You're in</h2>
        <p>Share this code with your household:</p>
        <p id="code-display"></p>
        <button id="copy">Copy code</button>
        <a href="index.html">Continue</a>
      </section>
    </main>

    <script src="household.js"></script>
    <script src="welcome.js"></script>
  </body>
</html>
