<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Settings</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icons/icon-192.png" />
    <meta name="theme-color" content="#0f6b6b" />
  </head>
  <body>
    <div class="top">
      <header>
        <a class="icon-button" href="index.html" aria-label="Back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m12 19-7-7 7-7" />
            <path d="M19 12H5" />
          </svg>
        </a>
        <h1>Settings</h1>
        <button id="logout" class="icon-button" aria-label="Log out">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m16 17 5-5-5-5" />
            <path d="M21 12H9" />
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
          </svg>
        </button>
      </header>

      <section id="household">
        <button id="share-link">Share invite link</button>
      </section>

      <nav class="tabs">
        <button data-tab="consumables" class="active" aria-selected="true">Consumables</button>
        <button data-tab="tasks" aria-selected="false">Tasks</button>
      </nav>
    </div>

    <main>
      <section id="consumables">
        <ul id="library"></ul>
      </section>
      <section id="tasks" hidden>
        <ul id="task-library"></ul>
      </section>
    </main>

    <button id="add" aria-label="Add">+</button>

    <dialog id="sheet">
      <form method="dialog">
        <h2 id="sheet-title">New consumable</h2>

        <label>
          Name
          <input name="name" type="text" required />
        </label>

        <label>
          How often
          <select name="period">
            <option value="weekly">weekly</option>
            <option value="biweekly">biweekly</option>
            <option value="monthly">monthly</option>
            <option value="every 2 months">every 2 months</option>
            <option value="every 3 months">every 3 months</option>
            <option value="every 4 months">every 4 months</option>
            <option value="every 5 months">every 5 months</option>
            <option value="every 6 months">every 6 months</option>
            <option value="every 7 months">every 7 months</option>
            <option value="every 8 months">every 8 months</option>
            <option value="every 9 months">every 9 months</option>
            <option value="every 10 months">every 10 months</option>
            <option value="every 11 months">every 11 months</option>
            <option value="yearly">yearly</option>
          </select>
        </label>

        <label>
          Status
          <select name="status">
            <option value="full">full</option>
            <option value="coming to an end">coming to an end</option>
            <option value="finished">finished</option>
          </select>
        </label>

        <label>
          Photo
          <input name="image" type="file" accept="image/*" />
        </label>

        <div class="actions">
          <button id="delete" value="delete" formnovalidate>Delete</button>
          <button value="cancel" formnovalidate>Cancel</button>
          <button value="save" class="primary">Save</button>
        </div>
      </form>
    </dialog>

    <dialog id="task-sheet">
      <form method="dialog">
        <h2>New task</h2>

        <label>
          Name
          <input name="name" type="text" required />
        </label>

        <label>
          How often
          <select name="period">
            <option value="weekly">weekly</option>
            <option value="biweekly">biweekly</option>
            <option value="monthly">monthly</option>
            <option value="every 2 months">every 2 months</option>
            <option value="every 3 months">every 3 months</option>
            <option value="every 4 months">every 4 months</option>
            <option value="every 5 months">every 5 months</option>
            <option value="every 6 months">every 6 months</option>
            <option value="every 7 months">every 7 months</option>
            <option value="every 8 months">every 8 months</option>
            <option value="every 9 months">every 9 months</option>
            <option value="every 10 months">every 10 months</option>
            <option value="every 11 months">every 11 months</option>
            <option value="yearly">yearly</option>
          </select>
        </label>

        <label>
          Difficulty
          <select name="difficulty">
            <option value="light">light</option>
            <option value="medium" selected>medium</option>
            <option value="heavy">heavy</option>
          </select>
        </label>

        <div class="actions">
          <button value="cancel" formnovalidate>Cancel</button>
          <button value="save" class="primary">Save</button>
        </div>
      </form>
    </dialog>

    <script src="household.js"></script>
    <script src="settings.js"></script>
  </body>
</html>
